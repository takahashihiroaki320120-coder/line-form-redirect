<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Googleフォームへ移動中...</title>
  <script charset="utf-8" src="https://line-scdn.net"></script>
</head>
<body>
  <p style="text-align:center; margin-top:50px; font-family: sans-serif;">Googleフォームへ移動しています...</p>

  <script>
    // ▼ 以下の4箇所をご自身の情報に書き換えてください ▼
    const LIFF_ID = "2012647962-dwFBtKUt";
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScB8eLAGSTHuX3Qd1Nv-BIqUdOd1UkvU0CZWVW6Rl2YcaJCJA/viewform";
    const ENTRY_USER_ID = "entry.1426180902";
    const ENTRY_NAME = "entry.1104849655";
    // ▲ 書き換えここまで ▲

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const userId = encodeURIComponent(profile.userId);
        const displayName = encodeURIComponent(profile.displayName);

        // 事前入力パラメータを付与してGoogleフォームへ移動
        const redirectUrl = `${FORM_URL}?usp=pp_url&${ENTRY_USER_ID}=${userId}&${ENTRY_NAME}=${displayName}`;
        window.location.replace(redirectUrl);

      } catch (err) {
        alert("エラーが発生しました: " + err.message);
      }
    }

    main();
  </script>
</body>
</html>
