<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Googleフォームへ移動中3...</title>
</head>
<body>
  <p id="status" style="text-align:center; margin-top:50px; font-family: sans-serif;">LINEシステムを読み込み中...</p>
  
  <script>
    // ▼ 以下の4箇所をご自身の情報に書き換えてください ▼
    const LIFF_ID = "2012647962-dwFBtKUt";
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScB8eLAGSTHuX3Qd1Nv-BIqUdOd1UkvU0CZWVW6Rl2YcaJCJA/viewform";
    const ENTRY_USER_ID = "entry.1426180902";
    const ENTRY_NAME = "entry.1104849655";
    
    const statusEl = document.getElementById('status');

    // SDKを動的に読み込み、成功・失敗を確実に判定する
    const script = document.createElement('script');
    script.src = 'https://line-scdn.net';
    
    script.onload = async function() {
      statusEl.textContent = 'Googleフォームへ移動しています...';
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const userId = encodeURIComponent(profile.userId);
        const displayName = encodeURIComponent(profile.displayName);

        const redirectUrl = `${FORM_URL}?usp=pp_url&${ENTRY_USER_ID}=${userId}&${ENTRY_NAME}=${displayName}`;
        window.location.replace(redirectUrl);

      } catch (err) {
        statusEl.textContent = 'LIFF実行エラー: ' + err.message;
      }
    };

    script.onerror = function() {
      statusEl.innerHTML = '【通信ブロック検知】<br>外部スクリプト(sdk.js)の読み込みが端末またはネットワークによって遮断されました。<br>Wi-Fiをオフにするか、別のブラウザ・端末でお試しください。';
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
